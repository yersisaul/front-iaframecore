# Construye la imagen del frontend en GitHub (no en el servidor de Coolify) y la
# publica en GHCR. Coolify solo hace "pull" de la imagen ya construida.
#
#   push a rama/tag v2.3.1  ->  ghcr.io/<org>/front-iaframecore:2.3.1
#                               ghcr.io/<org>/front-iaframecore:2.3.1-<sha corto>
name: Docker image

on:
  push:
    branches: ['v*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calcular nombre y versión de la imagen
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/front-iaframecore" >> "$GITHUB_OUTPUT"
          ref="${GITHUB_REF_NAME#v}"
          echo "version=${ref//\//-}" >> "$GITHUB_OUTPUT"   # "/" no es válido en un tag
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
