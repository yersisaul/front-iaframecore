<div class="dashboard-wrapper">
  <!-- Sidebar de navegación (Full height en el extremo izquierdo) -->
  <app-sidebar></app-sidebar>

  <!-- Backdrop Overlay para dispositivos móviles/tablets -->
  @if (!isSidebarCollapsed()) {
  <div class="sidebar-backdrop" (click)="toggleSidebar()"></div>
  }

  <!-- Contenedor del lado derecho -->
  <div class="main-container">
    <!-- Contenido principal -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Componente Flotante Picture-in-Picture (PiP) de Monitoreo -->
  <app-monitoring-pip></app-monitoring-pip>

  <!-- Widget Flotante de Alertas de Fiabilidad (Abajo a la derecha) -->
  <app-reliability-alert-widget></app-reliability-alert-widget>

  <!-- Modal Global Compartido de Alertas de Fiabilidad -->
  <app-reliability-alerts-modal></app-reliability-alerts-modal>
</div>
