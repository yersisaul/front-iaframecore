@if (currentUser()) {
<div class="session-control" [class.is-collapsed]="isCollapsed()" [ngStyle]="roleStyle()">

  <!-- Monogram Avatar -->
  <div class="sc-avatar" (click)="onUserControlClick($event)">
    <div class="avatar-ring">
      <div class="avatar-mono">
        {{ displayName().charAt(0).toUpperCase() }}
      </div>
    </div>
  </div>

  <!-- Identity -->
  <div class="sc-identity">
    <span class="user-name text-truncate" [title]="displayName()">
      {{ displayName() }}
    </span>
    <span class="user-role text-truncate">
      {{ displayRole() }}
    </span>
  </div>

  <!-- Theme Toggle -->
  <button type="button" class="btn-action btn-theme"
    (click)="toggleTheme(); $event.stopPropagation()"
    [title]="isDarkMode() ? 'Modo Claro' : 'Modo Oscuro'">
    @if (isDarkMode()) {
    <span class="icon-svg icon-theme-light action-icon"></span>
    } @else {
    <span class="icon-svg icon-theme-dark action-icon"></span>
    }
  </button>

  <!-- Logout -->
  <button type="button" class="btn-action btn-logout"
    (click)="onLogout(); $event.stopPropagation()"
    title="Cerrar Sesión">
    <span class="icon-svg icon-logout action-icon"></span>
  </button>

</div>
}
