@if (totalPages > 1) {
<div class="pagination-floating-wrapper">
  <div class="pagination-floating-bar d-flex align-items-center gap-3">
    <nav aria-label="Page navigation">
      <ul class="pagination pagination-md align-items-center mb-0" style="gap: 6px; padding: 0; list-style: none;">
        <li class="page-item" [class.disabled]="currentPage === 1">
          <button class="btn-ghost page-nav-btn d-flex align-items-center justify-content-center" (click)="prevPage()"
            aria-label="Previous" title="Página anterior">
            <span class="icon-svg icon-chevron-left" style="width: 16px; height: 16px;"></span>
          </button>
        </li>
        @for (page of visiblePages; track page) {
        <li class="page-item" [class.active]="currentPage === page">
          <button class="page-link-ghost" (click)="setPage(page)" [title]="'Página ' + formatPageNumber(page)">
            {{ formatPageNumber(page) }}
          </button>
        </li>
        }
        <li class="page-item" [class.disabled]="currentPage === totalPages">
          <button class="btn-ghost page-nav-btn d-flex align-items-center justify-content-center" (click)="nextPage()"
            aria-label="Next" title="Página siguiente">
            <span class="icon-svg icon-chevron-right" style="width: 16px; height: 16px;"></span>
          </button>
        </li>
      </ul>
    </nav>

    <!-- Jump to Page Input Container -->
    <div class="d-flex align-items-center gap-2 jump-to-page-container">
      <span class="text-muted small fw-medium text-nowrap">Ir a:</span>
      <input type="text" class="form-control form-control-sm text-center shadow-sm jump-input"
        [style.width]="getInputWidth()" [placeholder]="currentPage"
        inputmode="numeric" pattern="[0-9]*" (input)="onPageInput($event)" (keydown.enter)="jumpToPage($event)"
        (blur)="jumpToPage($event)" />
      <span class="text-muted small fw-medium pe-2 text-nowrap">de {{ formatPageNumber(totalPages) }}</span>
    </div>
  </div>
</div>
}
