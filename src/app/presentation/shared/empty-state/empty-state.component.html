<div class="empty-state-view" [style.minHeight]="minHeight">
  <div class="empty-icon-bubble">
    <span class="icon-svg {{ iconClass }} empty-icon"></span>
  </div>

  <h4 class="empty-state-title">{{ title }}</h4>

  @if (description) {
  <p class="empty-state-description">{{ description }}</p>
  }

  @if (showAction && actionText) {
  <button type="button" (click)="onAction()" class="empty-state-btn">
    <span class="icon-svg {{ actionIconClass }}" style="width: 0.85rem; height: 0.85rem;"></span>
    <span>{{ actionText }}</span>
  </button>
  }

  <ng-content></ng-content>
</div>
